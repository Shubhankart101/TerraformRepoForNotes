name: Update Project Terraform Use Cases

on:
  schedule:
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-use-cases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save weekly use-case snapshot
        shell: python
        run: |
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path('projects/DAILY_USE_CASES.md')
          content = path.read_text(encoding='utf-8')
          marker = 'Generated by `.github/workflows/update-project-use-cases.yml` every Monday at 7:00 AM IST.'
          today = datetime.now(timezone.utc).strftime('%Y-%m-%d')
            history = Path('projects/use-case-history')
            history.mkdir(parents=True, exist_ok=True)
            snapshot = history / f'{today}.md'
            if not snapshot.exists():
              snapshot.write_text(f'# Terraform use-case snapshot - {today}\n\n{content}', encoding='utf-8')
            path.write_text(content, encoding='utf-8')

      - name: Commit weekly snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/DAILY_USE_CASES.md projects/use-case-history
          git diff --cached --quiet && exit 0
          git commit -m "Archive weekly Terraform use cases"
          git push
